<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Amalgam mark</title>
  <desc id="desc">A neon violet geometric A with an orbit and central diamond.</desc>
  <defs>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".18" stop-color="#e6b4ff"/>
      <stop offset=".52" stop-color="#9a35ff"/>
      <stop offset="1" stop-color="#4810bb"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6415df"/>
